<html>
<head>
<title>List in html</title>
</head>
<body>
<h1>ORDERED LIST</h1>
<ol type="I">
<li>Apple</li>
<li>Banana</li>
<li>Carrot</li>
<li>Doughnut</li>
<li>Eggs</li>
</ol>
<br>
<hr>
<h1>UNORDERED LIST</H1>
<ul type="square">
<li>Pen</li>
<li>Eraser</li>
<li>Sharpener</li>
<li>Geometry Box</li>
<li>Pencil</li>
</ul>
</body>
</html>
